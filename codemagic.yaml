# 퇴근했니? iOS — Codemagic 빌드 설정
#
# 사용 전에 확인할 것
#  1) Codemagic 팀 설정 > Integrations > App Store Connect 에 API 키가 등록되어 있어야 한다
#     (yakcheck 때 만든 'yakcheck_app_store' 키를 같은 팀에서 그대로 쓴다).
#  2) Apple Developer 포털에 App ID com.kyeore.overtimetracker 가 있어야 한다.
#  3) environment.vars 의 APP_STORE_APP_ID 를 App Store Connect 앱 ID(숫자)로 바꾼다.
#  4) 서명: 팀 설정 > Code signing identities 에 배포 인증서/프로파일이 등록되어 있어야 한다
#     (distribution_type: app_store, bundle_identifier: com.kyeore.overtimetracker).
#
# 워크플로
#  - ios-check   : 시뮬레이터 빌드(서명 없음) — Swift 컴파일 오류 확인용, 무료
#  - ios-release : 서명 IPA 빌드 → App Store Connect 업로드(TestFlight). App Store 심사 제출은 하지 않는다.

workflows:
  ios-release:
    name: 퇴근했니? iOS (TestFlight 업로드)
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: yakcheck_app_store
    environment:
      node: 20.18.1
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.kyeore.overtimetracker
      vars:
        BUNDLE_ID: com.kyeore.overtimetracker
        XCODE_WORKSPACE: App.xcworkspace
        XCODE_SCHEME: App
        APP_STORE_APP_ID: "6839007688"
    scripts:
      - name: 의존성 설치
        script: |
          set -e
          npm install --no-audit --no-fund

      - name: iOS 프로젝트 동기화
        script: |
          set -e
          npx cap sync ios
          cd ios/App && pod install

      - name: 서명 설정 적용
        script: |
          set -e
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: 빌드 번호 올리기
        script: |
          set -e
          cd ios/App
          if [ -n "${BUILD_NUMBER:-}" ]; then
            BUILD="$BUILD_NUMBER"
          else
            BUILD="$(date -u +%Y%m%d%H%M)"
          fi
          # Info.plist 에 리터럴로 넣어야 확실히 반영된다(agvtool 은 프로젝트 설정만 바꿈).
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" App/Info.plist
          agvtool new-version -all "$BUILD" >/dev/null 2>&1 || true
          echo "CFBundleVersion=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' App/Info.plist)"
          echo "CFBundleShortVersionString=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' App/Info.plist)"

      - name: IPA 빌드
        script: |
          set -e
          xcode-project build-ipa \
            --workspace "ios/App/$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        # 내부 테스트만 한다. upload 는 Publishing 단계에서 그대로 수행되고,
        # submit_to_testflight=false 로 두면 외부 테스터용 '베타 심사 제출'(Test Information 필요)을 시도하지 않는다.
        submit_to_testflight: false
        submit_to_app_store: false
        beta_groups:
          - 퇴근했니 내부 테스트

  ios-check:
    name: 퇴근했니? iOS (시뮬레이터 빌드 확인 · 서명 없음)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      node: 20.18.1
      xcode: latest
      cocoapods: default
    scripts:
      - name: 의존성 설치
        script: |
          set -e
          npm install --no-audit --no-fund

      - name: iOS 프로젝트 동기화
        script: |
          set -e
          npx cap sync ios
          cd ios/App && pod install

      - name: 시뮬레이터용 빌드 (컴파일 오류 확인)
        script: |
          set -e
          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

    artifacts:
      - /tmp/xcodebuild_logs/*.log
